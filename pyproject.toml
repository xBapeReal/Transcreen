[project]
name = "transcreen"
version = "0.1.0"
description = "Live on-screen translator for Windows: reads foreign text with Windows OCR and paints the Turkish translation right on top of it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["translation", "ocr", "overlay", "windows", "turkish"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Turkish",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pillow>=10.4",
    "requests>=2.32",
    "deep-translator>=1.11.4",
    "winsdk>=1.0.0b10; sys_platform == 'win32'",
    "mss>=10.2.0",
    "ctranslate2>=4.8.1",
    "sentencepiece>=0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcreen"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
# Do not install the project into the env: on Python 3.11 an editable install
# breaks when the project path contains non-ASCII characters (.pth files are
# read with the ANSI code page, which garbles the path). The app runs from
# source via PYTHONPATH=src (see Transcreen.bat); pytest gets the same via
# tool.pytest pythonpath.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
